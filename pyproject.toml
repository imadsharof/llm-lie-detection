[project]
name = "liedetect"
version = "0.1.0"
description = "Benchmarking white-box and black-box lie detection for LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.56,<5",
    "huggingface_hub<1.0",     # repeng loaders use legacy dataset names (e.g. "commonsense_qa")
    "accelerate",
    "datasets>=2.16,<4",   # v4 dropped script-based datasets used by some loaders
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]